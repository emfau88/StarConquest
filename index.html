<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta
      name="description"
      content="StarConquest is a fast strategy game about linking star systems and redirecting energy."
    />
    <meta name="theme-color" content="#08265f" />
    <title>StarConquest &mdash; First Contact</title>
  </head>
  <body>
    <main id="app" class="game-shell">
      <canvas
        id="game-canvas"
        aria-label="StarConquest game field"
      ></canvas>

      <header class="hud" aria-label="Mission status">
        <div class="hud__mission">
          <span class="hud__brand-mark" aria-hidden="true"></span>
          <span class="hud__mission-copy">
            <span class="hud__eyebrow" id="hud-sector">Sector 01</span>
            <strong class="hud__title" id="hud-title">First Contact</strong>
          </span>
        </div>

        <div class="hud__objective-panel">
          <span class="hud__objective-label">Mission</span>
          <p class="hud__objective" id="hud-objective">
            Capture the red system
          </p>
        </div>

        <div class="hud__actions">
          <span class="hud__timer">
            <img
              class="hud-icon hud-icon--timer"
              src="./assets/ui/stopwatch.png"
              alt=""
              aria-hidden="true"
            />
            <time class="hud__time" id="hud-time" datetime="PT0S">00:00</time>
          </span>
          <button
            class="icon-button icon-button--map"
            id="map-button"
            type="button"
          >
            <span class="icon-button__label" id="map-label">Map</span>
          </button>
          <button
            class="icon-button"
            id="restart-button"
            type="button"
          >
            <img
              class="hud-icon"
              id="restart-icon"
              src="./assets/ui/restart.png"
              alt=""
              aria-hidden="true"
            />
            <span class="icon-button__label" id="restart-label">Restart</span>
          </button>
          <button
            class="icon-button"
            id="audio-button"
            type="button"
          >
            <img
              class="hud-icon"
              id="audio-icon"
              src="./assets/ui/audio-on.png"
              alt=""
              aria-hidden="true"
            />
            <span class="icon-button__label" id="audio-label">Audio on</span>
          </button>
          <button
            class="icon-button"
            id="fullscreen-button"
            type="button"
          >
            <img
              class="hud-icon"
              id="fullscreen-icon"
              src="./assets/ui/fullscreen-enter.png"
              alt=""
              aria-hidden="true"
            />
            <span class="icon-button__label" id="fullscreen-label">
              Fullscreen
            </span>
          </button>
          <button
            class="icon-button icon-button--primary"
            id="pause-button"
            type="button"
          >
            <img
              class="hud-icon"
              id="pause-icon"
              src="./assets/ui/pause.png"
              alt=""
              aria-hidden="true"
            />
            <span class="icon-button__label" id="pause-label">Pause</span>
          </button>
        </div>
      </header>

      <aside class="status-card" aria-live="polite">
        <span class="status-card__pulse" aria-hidden="true"></span>
        <span id="status-message">
          Drag from your blue system to another star
        </span>
      </aside>

      <section
        class="campaign-map"
        id="campaign-map"
        role="dialog"
        aria-modal="true"
        aria-labelledby="campaign-map-title"
        hidden
      >
        <img
          class="campaign-map__art"
          data-src="./assets/backgrounds/campaign-map.webp"
          decoding="async"
          alt=""
          aria-hidden="true"
        />
        <div class="campaign-map__shade" aria-hidden="true"></div>
        <header class="campaign-map__header">
          <span class="campaign-map__eyebrow" id="campaign-map-eyebrow">
            Campaign
          </span>
          <h1 id="campaign-map-title">Sector map</h1>
          <button
            class="campaign-map__close"
            id="campaign-map-close"
            type="button"
          >
            Close
          </button>
        </header>
        <nav class="campaign-map__nodes" aria-label="Campaign sectors">
          <span
            class="campaign-map__helion-branch"
            aria-hidden="true"
          ></span>
          <button
            class="campaign-map__node campaign-map__node--1"
            data-level-index="0"
            type="button"
          >
            <span class="campaign-map__number">01</span>
            <span class="campaign-map__name">First Contact</span>
          </button>
          <button
            class="campaign-map__node campaign-map__node--2"
            data-level-index="1"
            type="button"
          >
            <span class="campaign-map__number">02</span>
            <span class="campaign-map__name">Pressure Line</span>
          </button>
          <button
            class="campaign-map__node campaign-map__node--3"
            data-level-index="2"
            type="button"
          >
            <span class="campaign-map__number">03</span>
            <span class="campaign-map__name">Cut the Current</span>
          </button>
          <button
            class="campaign-map__node campaign-map__node--4"
            data-level-index="3"
            type="button"
          >
            <span class="campaign-map__number">04</span>
            <span class="campaign-map__name">Twin Fronts</span>
          </button>
          <button
            class="campaign-map__node campaign-map__node--5"
            data-level-index="4"
            type="button"
          >
            <span class="campaign-map__number">05</span>
            <span class="campaign-map__name">Heavy Orbit</span>
          </button>
          <button
            class="campaign-map__node campaign-map__node--6 campaign-map__node--helion"
            data-level-index="5"
            type="button"
          >
            <span class="campaign-map__number">06</span>
            <span class="campaign-map__name">Helion Run</span>
          </button>
        </nav>
      </section>

      <section
        class="result-overlay"
        id="result-overlay"
        aria-live="assertive"
        hidden
      >
        <div class="result-card">
          <span class="result-card__emblem" aria-hidden="true"></span>
          <span class="result-card__eyebrow" id="result-eyebrow">
            Sector secured
          </span>
          <h1 id="result-title">Network captured</h1>
          <div class="result-card__stars" id="result-stars" aria-label="3 stars">
            &#9733;&#9733;&#9733;
          </div>
          <p id="result-summary">First Contact completed in 00:00</p>
          <div class="result-card__actions">
            <button id="retry-button" type="button">Play again</button>
            <button id="next-button" type="button">Next sector</button>
          </div>
        </div>
      </section>

      <section class="orientation-message" aria-label="Device orientation">
        <strong>Rotate your device</strong>
        <span>StarConquest is designed for landscape play.</span>
      </section>

      <noscript>StarConquest requires JavaScript.</noscript>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
